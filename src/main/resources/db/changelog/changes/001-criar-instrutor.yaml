databaseChangeLog:
  - changeSet:
      id: 001-criar-instrutor
      author: caua
      changes:
        - createTable:
            tableName: instrutor
            columns:
              - column: { name: id, type: BIGINT, autoIncrement: true, constraints: { primaryKey: true, nullable: false } }
              - column: { name: nome, type: VARCHAR(120), constraints: { nullable: false } }
              - column: { name: email, type: VARCHAR(160), constraints: { nullable: false, unique: true } }
      rollback:
        - dropTable: { tableName: instrutor }
