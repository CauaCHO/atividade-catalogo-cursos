spring:
  application:
    name: catalogocursos
  datasource:
    url: ${DB_DEV_URL:${DB_URL}}
    username: ${DB_DEV_USERNAME:${DB_USERNAME}}
    password: ${DB_DEV_PASSWORD:${DB_PASSWORD}}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml
server:
  port: 8080
